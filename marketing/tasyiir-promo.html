  }

  body.capture #controls{display:none;}

  #stageWrap{width:1080px; height:1920px; position:relative; overflow:hidden; border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.5); background:var(--ink-950);}

  #stage{position:absolute; inset:0; overflow:hidden;}

  .layer{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; will-change:opacity,transform;}
  .safe{width:100%; padding:0 96px; display:flex; flex-direction:column; align-items:center;}

  /* Numbers always LTR even inside RTL Arabic layout, matching the real app's .ltr-nums utility */
  .ltr-nums{direction:ltr; unicode-bidi:isolate; display:inline-block; font-family:'IBM Plex Mono','Cairo',monospace;}

  .wordmark{font-family:'Cairo',sans-serif; font-weight:800; letter-spacing:.02em; direction:ltr;}
  .badge-t{display:inline-flex; align-items:center; justify-content:center; font-weight:800; color:#fff; background:var(--brand-500); border-radius:28px;}

  .tag{color:var(--ink-300); font-weight:600;}

  .pain-row{display:flex; align-items:center; gap:20px; width:100%;}
  .pain-dot{width:14px; height:14px; border-radius:50%; background:var(--ink-600, #4f5769); flex-shrink:0;}
  .pain-text{font-size:44px; font-weight:700; color:var(--ink-100); position:relative;}
  .pain-strike{position:absolute; right:0; top:50%; height:5px; background:var(--brand-500); border-radius:4px; transform-origin:right center;}

  .phone-frame{background:var(--ink-900); border:2px solid rgba(255,255,255,.06); border-radius:36px; box-shadow:0 30px 60px rgba(0,0,0,.45); overflow:hidden;}
  .phone-topbar{background:var(--ink-950); display:flex; align-items:center; gap:16px; border-bottom:1px solid rgba(255,255,255,.06);}
  .card{background:var(--ink-800); border-radius:20px; border:1px solid rgba(255,255,255,.05);}

  .stat-chip{background:rgba(16,185,129,.12); color:var(--brand-400); border:1px solid rgba(16,185,129,.3); border-radius:999px; font-weight:700;}
  .unpaid-chip{background:rgba(239,68,68,.12); color:#f87171; border:1px solid rgba(239,68,68,.3); border-radius:999px; font-weight:700;}

  #controls{width:1080px; max-width:100%; display:flex; align-items:center; gap:14px; font-family:sans-serif; color:#cfd3da;}
  #controls button{background:var(--brand-600); color:#fff; border:none; border-radius:10px; padding:10px 18px; font-size:15px; cursor:pointer; font-weight:600;}
  #controls button:hover{background:var(--brand-500);}
  #scrub{flex:1;}
  #tlabel{font-variant-numeric:tabular-nums; width:110px; text-align:center; font-size:14px;}
</style>

/* ============================================================
   TASYIIR — Motion Promo — deterministic frame-by-frame render

// ---------- timeline (seconds) ----------
const DURATION = 28.0;
const FPS = 30;
const SCENES = {
  logo:     [0.0, 3.4],
  problem:  [3.0, 8.6],
  students: [8.2, 12.9],

// ---------- easing ----------
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const easeOutCubic = t=>1-Math.pow(1-t,3);
const easeOutBack = t=>{const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const easeInOutSine = t=>-(Math.cos(Math.PI*t)-1)/2;
// local progress 0..1 within [a,b], clamped
function prog(t,a,b){ if(b<=a) return t>=b?1:0; return clamp((t-a)/(b-a),0,1); }
function sceneWindow(t, key, fadeIn=0.35, fadeOut=0.35){
  const [a,b] = SCENES[key];
  if(t < a-fadeIn || t > b+fadeOut) return {active:false, op:0, local:0, a, b};
  let op = 1;
  if(t < a) op = prog(t, a-fadeIn, a);
  else if(t > b) op = 1 - prog(t, b, b+fadeOut);
  const local = clamp((t-a)/(b-a), 0, 1.4);
  return {active:true, op:clamp(op,0,1), local, a, b, t};
}

// ---------- DOM builders ----------
const stage = document.getElementById('stage');

// Scene 2: Problem
const painLayer = el('div','','');

// Scene 3: Students & groups
const studentsLayer = phoneFrame(`

const endLayer = el('div','','');

endLayer.innerHTML = `

`;
stage.appendChild(endLayer);

// ---------- renderAt(t): pure function of t, no randomness, no timers ----------
function setOp(elm, op, transform){
  if(!elm) return;
  elm.style.opacity = op;
  if(transform!==undefined) elm.style.transform = transform;
}

function renderAt(t){
  t = clamp(t, 0, DURATION);

  // ---- Scene 1: logo ----
  {
    const s = sceneWindow(t,'logo',0,0.5);
    logoLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const badgeIn = easeOutBack(prog(t, s.a, s.a+0.7));
      const wordOp = easeOutCubic(prog(t, s.a+0.5, s.a+1.1));
      const ctOp = easeOutCubic(prog(t, s.a+0.9, s.a+1.4));
      const tagOp = easeOutCubic(prog(t, s.a+1.3, s.a+1.9));
      const fadeOut = 1 - easeOutCubic(prog(t, s.b-0.4, s.b));
      const g = Math.min(fadeOut, 1);
      setOp(document.getElementById('logoBadge'), Math.min(badgeIn,1)*g, `scale(${lerp(0.4,1,badgeIn)}) rotate(${lerp(-18,0,badgeIn)}deg)`);
      setOp(document.getElementById('logoWord'), wordOp*g, `translateY(${lerp(18,0,wordOp)}px)`);
      setOp(document.getElementById('logoCenterType'), ctOp*g, `translateY(${lerp(12,0,ctOp)}px)`);
      setOp(document.getElementById('logoTag'), tagOp*g, `translateY(${lerp(12,0,tagOp)}px)`);
    }
  }

  // ---- Scene 2: problem ----
  {
    const s = sceneWindow(t,'problem',0.4,0.4);
    painLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const starts = [s.a+0.3, s.a+2.1, s.a+3.9];
      const strikeDur = 0.6, strikeDelay = 0.55;
      starts.forEach((st,i)=>{
        const row = document.getElementById('painRow'+i);
        const strike = document.getElementById('painStrike'+i);
        const appear = easeOutCubic(prog(t, st, st+0.5));
        setOp(row, appear, `translateY(${lerp(16,0,appear)}px)`);
        const sw = easeInOutSine(prog(t, st+strikeDelay, st+strikeDelay+strikeDur));
        strike.style.width = (sw*100)+'%';
      });
      const fadeOut = 1 - easeOutCubic(prog(t, s.b-0.4, s.b));
      painLayer.style.opacity = Math.min(1, fadeOut===1?1:fadeOut);
      // overall fade-in of the whole layer at very start
      const layerIn = easeOutCubic(prog(t, s.a-0.4, s.a));
      painLayer.style.opacity = Math.min(layerIn, fadeOut);
    }
  }

  // ---- Scene 3: students ----
  {
    const s = sceneWindow(t,'students');
    studentsLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const titleOp = easeOutCubic(prog(t, s.a, s.a+0.5));
      const title = studentsLayer.querySelector('.featTitle');
      title.textContent = CONTENT.f1.title;
      setOp(title, titleOp*s.op, `translateY(${lerp(14,0,titleOp)}px)`);
      CONTENT.f1.students.forEach((_,i)=>{
        const st = s.a + 0.6 + i*0.35;
        const rp = easeOutCubic(prog(t, st, st+0.5));
        setOp(document.getElementById('studentRow'+i), rp*s.op, `translateY(${lerp(24,0,rp)}px)`);
      });
      const statOp = easeOutCubic(prog(t, s.a+1.9, s.a+2.4));
      setOp(document.getElementById('studentsStat'), statOp*s.op);
    }
  }

  // ---- Scene 4: payments ----
  {
    const s = sceneWindow(t,'payments');
    paymentsLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const titleOp = easeOutCubic(prog(t, s.a, s.a+0.5));
      const title = paymentsLayer.querySelector('.featTitle');
      title.textContent = CONTENT.f2.title;
      setOp(title, titleOp*s.op, `translateY(${lerp(14,0,titleOp)}px)`);
      const countP = easeOutCubic(prog(t, s.a+0.5, s.a+2.0));
      const target = parseInt(CONTENT.f2.amount.replace(/,/g,''),10);
      const val = Math.round(lerp(0, target, countP));
      document.getElementById('amountCounter').textContent = val.toLocaleString('en-US');
      const chipOp = easeOutCubic(prog(t, s.a+2.2, s.a+2.7));
      setOp(document.getElementById('unpaidChip'), chipOp*s.op);
      for(let i=0;i<7;i++){
        const bar = document.getElementById('payBar'+i);
        const bp = easeOutCubic(prog(t, s.a+2.5+i*0.08, s.a+3.0+i*0.08));
        bar.style.height = (lerp(0, parseFloat(bar.dataset.h), bp))+'px';
        bar.style.opacity = s.op;
      }
    }
  }

  // ---- Scene 5: schedule ----
  {
    const s = sceneWindow(t,'schedule');
    scheduleLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const titleOp = easeOutCubic(prog(t, s.a, s.a+0.5));
      const title = scheduleLayer.querySelector('.featTitle');
      title.textContent = CONTENT.f3.title;
      setOp(title, titleOp*s.op, `translateY(${lerp(14,0,titleOp)}px)`);
      for(let i=0;i<4;i++){
        const st = s.a + 0.6 + i*0.35;
        const rp = easeOutCubic(prog(t, st, st+0.5));
        setOp(document.getElementById('schedRow'+i), rp*s.op, `translateX(${lerp(30,0,rp)}px)`);
      }
    }
  }

  // ---- Scene 6: stats ----
  {
    const s = sceneWindow(t,'stats');
    statsLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const titleOp = easeOutCubic(prog(t, s.a, s.a+0.5));
      const title = statsLayer.querySelector('.featTitle');
      title.textContent = CONTENT.f4.title;
      setOp(title, titleOp*s.op, `translateY(${lerp(14,0,titleOp)}px)`);
      const cp = easeOutCubic(prog(t, s.a+0.5, s.a+1.6));
      document.getElementById('statStudents').textContent = Math.round(lerp(0, parseInt(CONTENT.f4.students,10), cp)).toLocaleString('en-US');
      document.getElementById('statRevenue').textContent = Math.round(lerp(0, parseInt(CONTENT.f4.revenue.replace(/,/g,''),10), cp)).toLocaleString('en-US');
      for(let i=0;i<8;i++){
        const bar = document.getElementById('statBar'+i);
        const bp = easeOutCubic(prog(t, s.a+1.0+i*0.08, s.a+1.5+i*0.08));
        bar.style.height = (lerp(0, parseFloat(bar.dataset.h)*2, bp))+'px';
        bar.style.opacity = s.op;
      }
      const chipOp = easeOutCubic(prog(t, s.a+2.9, s.a+3.4));
      setOp(document.getElementById('growthChip'), chipOp*s.op);
    }
  }

  // ---- Scene 7: end ----
  {
    const s = sceneWindow(t,'end',0.4,0);
    endLayer.style.display = s.active ? 'flex':'none';
    if(s.active){
      const badgeIn = easeOutBack(prog(t, s.a, s.a+0.6));
      setOp(document.getElementById('endBadge'), badgeIn*s.op, `scale(${lerp(0.5,1,badgeIn)})`);
      const ctaOp = easeOutCubic(prog(t, s.a+1.0, s.a+1.5));
      setOp(document.getElementById('endCta'), ctaOp*s.op);
    }
  }
}
window.renderAt = renderAt;
window.TASYIIR_DURATION = DURATION;
window.TASYIIR_FPS = FPS;

// ---------- capture mode ----------
const params = new URLSearchParams(location.search);
const isCapture = params.has('capture');
if(isCapture){
  document.body.classList.add('capture');
  const tParam = parseFloat(params.get('t') || '0');
  renderAt(tParam);
} else {
  // ---------- interactive preview controls ----------
  let playing = false, startWall = 0, startT = 0, raf = null;
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const scrub = document.getElementById('scrub');
  const tlabel = document.getElementById('tlabel');
  scrub.max = DURATION;

  function frame(){
    if(!playing) return;
    const now = performance.now()/1000;
    let t = startT + (now - startWall);
    if(t >= DURATION){ t = DURATION; playing = false; playBtn.textContent='Play'; }
    renderAt(t);
    scrub.value = t;
    tlabel.textContent = t.toFixed(2)+' / '+DURATION.toFixed(2);
    if(playing) raf = requestAnimationFrame(frame);
  }
  playBtn.addEventListener('click', ()=>{
    if(playing){ playing=false; playBtn.textContent='Play'; cancelAnimationFrame(raf); return; }
    playing = true; playBtn.textContent='Pause';
    startWall = performance.now()/1000;
    startT = parseFloat(scrub.value);
    if(startT >= DURATION) startT = 0;
    raf = requestAnimationFrame(frame);
  });
  replayBtn.addEventListener('click', ()=>{
    playing = false; playBtn.textContent='Play';
    renderAt(0); scrub.value = 0; tlabel.textContent = '0.00 / '+DURATION.toFixed(2);
  });
  scrub.addEventListener('input', ()=>{
    playing = false; playBtn.textContent='Play';
    const t = parseFloat(scrub.value);
    renderAt(t);
    tlabel.textContent = t.toFixed(2)+' / '+DURATION.toFixed(2);
  });
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  renderAt(0);
  tlabel.textContent = '0.00 / '+DURATION.toFixed(2);
  if(!reduceMotion){
    // autoplay a preview once on load
  }
}
</script>
